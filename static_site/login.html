<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CGI Login</title>
</head>
<body>
  <h1>CGI Login</h1>
  <form action="/cgi-bin/login" method="POST">
    <p>
      <label>Username:
        <input type="text" name="username">
      </label>
    </p>
    <p>
      <label>Password:
        <input type="password" name="password">
      </label>
    </p>
    <p>
      <button type="submit">Submit</button>
    </p>
  </form>
</body>
</html>
